site_name: CourseForge Docs
site_description: Plataforma de Cursos
site_author: Professor
theme:
  name: material
  language: pt
  icon:
    logo: material/school
  palette:
  - scheme: default
    primary: deep purple
    accent: teal
    toggle:
      icon: material/brightness-7
      name: Modo escuro
  - scheme: slate
    primary: deep purple
    accent: teal
    toggle:
      icon: material/brightness-4
      name: Modo claro
  font:
    text: Inter
    code: JetBrains Mono
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.indexes
  - navigation.path
  - navigation.top
  - toc.integrate
  - search.suggest
  - search.highlight
  - content.tabs.link
  - content.code.copy
extra_css:
- stylesheets/custom.css
markdown_extensions:
- admonition
- pymdownx.details
- pymdownx.superfences
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite
- pymdownx.snippets
- pymdownx.emoji:
    emoji_index: !!python/name:material.extensions.emoji.twemoji
    emoji_generator: !!python/name:material.extensions.emoji.to_svg
- attr_list
- md_in_html
- toc:
    permalink: true
